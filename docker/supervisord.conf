; Runs php-fpm and nginx side by side in one container.
;
; Both are set to autorestart=false with a shared exitcodes policy: if either
; dies the whole container should die so Docker's restart policy handles it,
; rather than supervisord silently limping along serving 502s.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=false
startretries=0
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; nginx must start after php-fpm is listening on :9000, otherwise the first
; requests 502. priority alone does not wait, but grocy tolerates the brief
; window and the healthcheck's start-period covers it.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startretries=0
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
command=sh -c 'printf "READY\n"; while read -r line; do kill -SIGQUIT $PPID; printf "RESULT 2\nOK"; done'
