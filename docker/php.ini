; Grocy PHP settings.

; Product/recipe pictures and the Paperless-style file upload feature. Keep
; these at or below nginx's client_max_body_size (128M).
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
max_execution_time = 300

date.timezone = UTC

; Grocy renders Blade templates to data/viewcache at runtime; opcache covers
; the PHP sources themselves.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
