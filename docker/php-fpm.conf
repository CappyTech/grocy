; Overrides the base image's www pool.
;
; Named zz-grocy.conf so it loads after www.conf and wins on duplicate keys.

[www]
user = grocy
group = grocy

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically -- guards against slow leaks in long-running
; php-fpm children on a box that rarely restarts this container.
pm.max_requests = 500

; Surface worker output in docker logs rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; grocy reads its settings from GROCY_* environment variables, which php-fpm
; does not pass to workers unless they are declared. Rather than enumerate
; every GROCY_* name here, clear_env=no above keeps the container environment
; intact for getenv() -- see public/index.php and helpers/extensions.php.
