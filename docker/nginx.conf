# Grocy nginx config.
#
# Mirrors the routing the linuxserver image used, minus the TLS/QUIC listeners:
# TLS terminates upstream (frp/Caddy edge), so this serves plain HTTP on :80.

user grocy;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Barcode/product images can be sizeable; grocy's own upload limit is set
    # in php.ini and these two must not be the tighter of the pair.
    client_max_body_size 128M;
    client_body_temp_path /var/lib/nginx/tmp;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /app/www/public;
        index index.php;

        # Grocy routes everything through index.php (Slim). DISABLE_URL_REWRITING
        # is false by default, so pretty URLs like /stockoverview must reach it.
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ ^(.+\.php)(.*)$ {
            fastcgi_split_path_info ^(.+\.php)(.*)$;
            if (!-f $document_root$fastcgi_script_name) { return 404; }
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
        }

        # Long-lived caching for the versioned vendor bundles (?v=<grocy version>).
        location /packages/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location ~ /\.(ht|git) {
            deny all;
        }
    }
}
